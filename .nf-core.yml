repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-tiara_fcsgx_analysis_logo_light.png
    - docs/images/nf-core-tiara_fcsgx_analysis_logo_light.png
    - docs/images/nf-core-tiara_fcsgx_analysis_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - assets/sendmail_template.txt
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-tiara_fcsgx_analysis_logo_light.png
    - docs/images/nf-core-tiara_fcsgx_analysis_logo_light.png
    - docs/images/nf-core-tiara_fcsgx_analysis_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: sanger-tol
  name: tiara_fcsgx_analysis
  description: A small pipeline to run tiara and fcs_gx for the GenomeNote-pipelines
    project
  author: Damon-Lee B Pointon
  version: 0.1.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - gpu
  is_nfcore: false
